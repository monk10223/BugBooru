{% extends 'base.html' %}

{% block title %}Delete post - BugBooru{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Delete this post?</h2>

    <img src="{{ post.image_url }}" alt="Post {{ post.pk }}" class="preview">

    <p class="meta">
        Uploaded by {{ post.uploaded_by }}<br>
        Tags: {{ tags|default:"none" }}
    </p>

    <p>This will also delete all of its comments. It can't be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger">Yes, delete</button>
        <a href="{% url 'post-details' post.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}

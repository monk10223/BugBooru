{% extends 'base.html' %}

{% block title %}New post - BugBooru{% endblock %}

{% block content %}
<div class="form-card">
    <h2>New post</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create post</button>
    </form>
</div>
{% endblock %}

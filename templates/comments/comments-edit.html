{% extends 'base.html' %}

{% block title %}Edit comment - BugBooru{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Edit comment</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'post-details' object.post_id %}">Cancel</a>
    </form>
</div>
{% endblock %}
